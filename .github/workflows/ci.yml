name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # No `version:` here on purpose. package.json pins
      # `packageManager: pnpm@9.15.9`, and pnpm/action-setup@v4 aborts the
      # job outright when the version is declared in both places rather than
      # picking one. That conflict shipped in the first commit and failed
      # every CI run the repository has ever had, at the setup step, before
      # a line of our code was reached. One source of truth: package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm tsc --noEmit

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm prettier --check .

      - name: Build
        run: pnpm build
