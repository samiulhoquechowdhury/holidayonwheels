version: 2

updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 5
    versioning-strategy: increase
    commit-message:
      prefix: "chore"
      include: scope
    groups:
      # Next and React move together — splitting them produces PRs that
      # cannot pass CI on their own.
      next:
        patterns:
          - "next"
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
          - "eslint-config-next"
      tooling:
        patterns:
          - "eslint*"
          - "@typescript-eslint/*"
          - "prettier*"
          - "typescript"
          - "husky"
          - "lint-staged"
      styling:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"
          - "clsx"
          - "tailwind-merge"
      motion:
        patterns:
          - "framer-motion"
          - "lenis"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    commit-message:
      prefix: "ci"
